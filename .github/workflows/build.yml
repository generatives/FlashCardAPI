name: Build and Push Image

on:
  push:
    branches: ["main", "master"]

env:
  IMAGE_NAME: flashcardapi
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  AR_REPO: ${{ vars.ARTIFACT_REPO }} # e.g. flashcardapi
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Recommended: Workload Identity Federation
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Fallback: Service Account Key JSON
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 466.0.0'

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build image
        run: |
          IMAGE_URI=$REGISTRY/$PROJECT_ID/$AR_REPO/$IMAGE_NAME
          TAG=${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI:$TAG" .

      - name: Push image
        run: |
          docker push "$IMAGE_URI:$TAG"
          # Also push latest on main
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            docker tag "$IMAGE_URI:$TAG" "$IMAGE_URI:latest"
            docker push "$IMAGE_URI:latest"
          fi

      - name: Summary
        run: |
          echo "Built and pushed $IMAGE_URI:$TAG" >> $GITHUB_STEP_SUMMARY

