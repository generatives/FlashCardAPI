openapi: 3.1.1
info:
  title: FlashCardAPI
  version: "0.2.0"
  description: |
    Spaced-repetition Flash Card API backed by Firestore.
    Auth: API Key via `X-API-Key` or `Authorization: Bearer <KEY>`.
servers:
  - url: https://flash-card-api-268596976051.us-central1.run.app
    description: Cloud Run base URL (replace with your service URL)
tags:
  - name: flashcards
    description: Flash card operations
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key sent as X-API-Key header
  schemas:
    Card:
      type: object
      properties:
        id:
          type: string
        front:
          type: string
        back:
          type: string
        created_at:
          type: string
          format: date-time
        easiness:
          type: number
        interval_days:
          type: integer
        repetitions:
          type: integer
        due_at:
          type: string
          format: date-time
      required: [id, front, back, created_at, easiness, interval_days, repetitions, due_at]
    CardCreate:
      type: object
      properties:
        front:
          type: string
        back:
          type: string
      required: [front, back]
    AttemptRequest:
      type: object
      properties:
        card_id:
          type: string
        rating:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 5
            - type: string
              enum: [again, hard, ok, good, easy]
      required: [card_id, rating]
security:
  # Either X-API-Key or Bearer will satisfy auth
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [flashcards]
      summary: Health check
      description: Returns ok=true. No authentication required.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
              example: { ok: true }

  /scheduled:
    get:
      operationId: getScheduledCards
      tags: [flashcards]
      summary: Get cards due for review
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
          description: Max number of cards to return (1-500)
      responses:
        '200':
          description: Cards due now
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  count:
                    type: integer
                required: [cards, count]
              example:
                cards:
                  - id: "abc123"
                    front: "Capital of France?"
                    back: "Paris"
                    created_at: "2024-01-01T12:00:00Z"
                    easiness: 2.5
                    interval_days: 0
                    repetitions: 0
                    due_at: "2024-01-01T12:00:00Z"
                count: 1

  /cards:
    post:
      operationId: addCards
      tags: [flashcards]
      summary: Add new cards
      description: |
        Accepts a single card object. The server also supports sending an array of card objects,
        but this schema declares the single-object form to satisfy tools requiring object bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
            examples:
              single:
                value: { front: "Capital of France?", back: "Paris" }
      responses:
        '201':
          description: Cards created
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string
                required: [inserted, ids]
              example: { inserted: 2, ids: ["abc123", "def456"] }
        '400':
          description: Invalid input

  /attempts:
    post:
      operationId: recordAttempts
      tags: [flashcards]
      summary: Record multiple attempts and update schedules
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attempts:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttemptRequest'
              required: [attempts]
            examples:
              many:
                value:
                  attempts:
                    - { card_id: "abc123", rating: "good" }
                    - { card_id: "def456", rating: 1 }
      responses:
        '200':
          description: Updated cards and any errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        card_id:
                          type: string
                          nullable: true
                        index:
                          type: integer
                          nullable: true
                        error:
                          type: string
                      required: [error]
                required: [updated, cards, errors]
